[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# --strict-markers turns a typo in a marker name into an error instead of a
# silently skipped test. Coverage flags are passed on the command line rather
# than pinned here, so a plain `pytest` run stays fast.
addopts =
    --strict-markers
    --tb=short

markers =
    unit: Unit tests
    integration: Integration tests against a live or simulated appliance
    performance: Performance and load tests
    slow: Slow running tests
    asyncio: Async tests

norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    frontend-dashboard
    automation-showcase
