name: CI

# The test job deliberately has no continue-on-error. A pipeline that stays
# green while its tests fail is worse than having no pipeline, because it
# converts a real signal into a decoration.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linters
        run: pip install flake8 black isort mypy

      # Blocking: syntax errors and undefined names are always real bugs.
      - name: Fail on syntax errors and undefined names
        run: flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics

      # Advisory: most of this codebase predates the formatter, so a hard gate
      # here would only produce a red badge that nobody reads. Reported, not enforced.
      - name: Style report
        continue-on-error: true
        run: |
          flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
          black --check --diff src tests || true
          isort --check-only --diff src tests || true
          mypy src --ignore-missing-imports || true

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-dashboard/package-lock.json

      - name: Install
        working-directory: ./frontend-dashboard
        run: npm ci

      - name: Build
        working-directory: ./frontend-dashboard
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: netsec-automation:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Dependency and filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Publish findings to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy
